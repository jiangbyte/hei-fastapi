name: hei-fastapi-multi

x-backend-build: &backend-build
  build:
    context: .

x-backend-env: &backend-env
  APP__HOST: 0.0.0.0
  APP__PORT: 8000
  APP__DEBUG: "false"
  APP__CONFIG_CRYPTO_KEY: ${APP__CONFIG_CRYPTO_KEY:?APP__CONFIG_CRYPTO_KEY is required}
  APP__TRUSTED_PROXY_IPS: ${DOCKER_TRUSTED_PROXY_IPS:-["172.16.0.0/12","127.0.0.1"]}
  APP__WORKERS: ${APP__WORKERS:-1}
  DB__URL: ${DB__URL:?DB__URL is required}
  REDIS__URL: ${REDIS__URL:?REDIS__URL is required}
  CELERY__BROKER_URL: ${CELERY__BROKER_URL:?CELERY__BROKER_URL is required}
  CORS__ALLOW_ORIGINS: ${CORS__ALLOW_ORIGINS:-["http://localhost:8081","http://127.0.0.1:8081","http://localhost:8082","http://127.0.0.1:8082"]}
  AUTH__SESSION_IDLE_TIMEOUT_SECONDS: ${AUTH__SESSION_IDLE_TIMEOUT_SECONDS:-1800}
  AUTH__SESSION_COOKIE_SECURE: ${AUTH__SESSION_COOKIE_SECURE:-false}
  DB__POOL_SIZE: ${DB__POOL_SIZE:-5}
  DB__MAX_OVERFLOW: ${DB__MAX_OVERFLOW:-5}
  REDIS__MAX_CONNECTIONS: ${REDIS__MAX_CONNECTIONS:-500}

services:
  migrate:
    <<: *backend-build
    environment:
      <<: *backend-env
    command: ["migrate"]
    restart: "no"

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./docker/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    <<: *backend-build
    environment:
      <<: *backend-env
    command: ["api"]
    expose:
      - "8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend-build
    environment:
      <<: *backend-env
      CELERY__WORKER_POOL: ${CELERY__WORKER_POOL:-solo}
      CELERY__WORKER_CONCURRENCY: ${CELERY__WORKER_CONCURRENCY:-1}
    command: ["worker"]
    volumes:
      - backend_storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    <<: *backend-build
    environment:
      <<: *backend-env
    command: ["beat"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    profiles: ["admin"]
    build:
      context: ./web/admin
    environment:
      BACKEND_URL: http://gateway:8000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-10m}
      HSTS_HEADER: ${HSTS_HEADER:-max-age=31536000; includeSubDomains}
    ports:
      - "${ADMIN_PORT:-8081}:81"
    depends_on:
      - gateway
    restart: unless-stopped

  portal:
    profiles: ["portal"]
    build:
      context: ./web/portal
    environment:
      BACKEND_URL: http://gateway:8000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-10m}
      HSTS_HEADER: ${HSTS_HEADER:-max-age=31536000; includeSubDomains}
    ports:
      - "${PORTAL_PORT:-8082}:80"
    depends_on:
      - gateway
    restart: unless-stopped

  seed:
    profiles: ["seed"]
    <<: *backend-build
    environment:
      <<: *backend-env
      SEED_SUPER_ADMIN_ACCOUNT: ${SEED_SUPER_ADMIN_ACCOUNT:-superadmin}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-123456}
    command: ["seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  backend_storage:
