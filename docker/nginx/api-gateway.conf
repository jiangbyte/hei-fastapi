upstream hei_api {
    least_conn;
    server api:8000;
}

upstream hei_im_ws {
    least_conn;
    server api:18080;
}

server {
    listen 8000;
    server_name _;
    client_max_body_size 10m;

    # TLS: terminate at edge LB / ingress. This gateway is HTTP-only on :8000.
    # When behind HTTPS, set X-Forwarded-Proto and enable AUTH__SESSION_COOKIE_SECURE.

    # IM Binary WebSocket（直连同进程网关，不经 FastAPI HTTP 端口）
    location /ws {
        proxy_pass http://hei_im_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://hei_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
