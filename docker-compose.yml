name: hei-fastapi-single

x-backend-env: &backend-env
  APP__HOST: 0.0.0.0
  APP__PORT: 8000
  APP__DEBUG: "false"
  APP__CONFIG_CRYPTO_KEY: ${APP__CONFIG_CRYPTO_KEY:?APP__CONFIG_CRYPTO_KEY is required}
  APP__TRUSTED_PROXY_IPS: ${DOCKER_TRUSTED_PROXY_IPS:-["172.16.0.0/12","127.0.0.1"]}
  DB__URL: ${DB__URL:?DB__URL is required}
  REDIS__URL: ${REDIS__URL:?REDIS__URL is required}
  SNAIL_JOB__SERVER_HOST: ${SNAIL_JOB__SERVER_HOST:-127.0.0.1}
  SNAIL_JOB__SERVER_PORT: ${SNAIL_JOB__SERVER_PORT:-17888}
  SNAIL_JOB__HOST_IP: ${SNAIL_JOB__HOST_IP:-}
  SNAIL_JOB__HOST_PORT: ${SNAIL_JOB__HOST_PORT:-17889}
  SNAIL_JOB__NAMESPACE: ${SNAIL_JOB__NAMESPACE:-764d604ec6fc45f68cd92514c40e9e1a}
  SNAIL_JOB__GROUP_NAME: ${SNAIL_JOB__GROUP_NAME:-hei_fastapi_group}
  SNAIL_JOB__TOKEN: ${SNAIL_JOB__TOKEN:-SJ_Wyz3dmsdbDOkDujOTSSoBjGQP1BMsVnj}
  SNAIL_JOB__LABELS: ${SNAIL_JOB__LABELS:-env:docker,app:hei-fastapi}
  CORS__ALLOW_ORIGINS: ${CORS__ALLOW_ORIGINS:-["http://localhost:8081","http://127.0.0.1:8081"]}
  AUTH__SESSION_IDLE_TIMEOUT_SECONDS: ${AUTH__SESSION_IDLE_TIMEOUT_SECONDS:-1800}
  AUTH__SESSION_COOKIE_SECURE: ${AUTH__SESSION_COOKIE_SECURE:-false}
  DB__POOL_SIZE: ${DB__POOL_SIZE:-5}
  DB__MAX_OVERFLOW: ${DB__MAX_OVERFLOW:-5}
  REDIS__MAX_CONNECTIONS: ${REDIS__MAX_CONNECTIONS:-100}

services:
  hei:
    build:
      context: .
    environment:
      <<: *backend-env
    command: ["all"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/internal/health/live', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  admin:
    profiles: ["admin"]
    build:
      context: ./web/admin
    environment:
      BACKEND_URL: http://hei:8000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-10m}
      HSTS_HEADER: ${HSTS_HEADER:-max-age=31536000; includeSubDomains}
    ports:
      - "${ADMIN_PORT:-8081}:81"
    depends_on:
      hei:
        condition: service_healthy
    restart: unless-stopped

  portal:
    profiles: ["portal"]
    build:
      context: ./web/portal
    environment:
      BACKEND_URL: http://hei:8000
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-10m}
      HSTS_HEADER: ${HSTS_HEADER:-max-age=31536000; includeSubDomains}
    ports:
      - "${PORTAL_PORT:-8082}:80"
    depends_on:
      hei:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_storage:
