name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,postgres,sqlite]"
      - name: Ruff
        run: ruff check app tests
      - name: Unit + API tests
        env:
          # Valid Fernet key (32 url-safe base64-encoded bytes); CI-only, not for prod.
          APP__CONFIG_CRYPTO_KEY: "EkFRKxJWiXzKVpHYuMq_hcPvTdQr2ThbA8-J_HYZib4="
          DB__URL: "sqlite+aiosqlite:///:memory:"
          REDIS__URL: "redis://localhost:6379/0"
        run: pytest tests/unit tests/api -q --tb=short
      - name: Bandit (medium+)
        run: bandit -q -r app -x app/modules/biz -ll
      - name: pip-audit
        run: pip-audit --strict || pip-audit
        continue-on-error: true

  frontend-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # auto-imports.d.ts / components.d.ts 为本地生成物，CI 先跑 vite 产出后再类型检查
      - run: pnpm exec vite build --outDir node_modules/.cache/ci-dist
      - run: pnpm exec vue-tsc -b --pretty false

  frontend-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/portal
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/portal/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
